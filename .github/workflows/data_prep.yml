name: Criteria 2 - Data Preparation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  prepare-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data preparation script
        run: python src/prepare_data.py

      - name: Upload train and test splits as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-train-test-splits
          path: |
            data/processed/train.csv
            data/processed/test.csv
          retention-days: 7

  next-job-preview:
    runs-on: ubuntu-latest
    needs: prepare-data

    steps:
      - name: Download train and test splits artifact
        uses: actions/download-artifact@v4
        with:
          name: tourism-train-test-splits
          path: data/processed

      - name: Verify downloaded splits in next job
        run: |
          ls -lh data/processed/train.csv data/processed/test.csv
          head -n 3 data/processed/train.csv
