name: Criteria 3 - Model Training & Tracking

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/train_model.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download train and test splits artifact if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tourism-train-test-splits
          path: data/processed

      - name: - name: Generate train and test splits
        run: python src/prepare_data.py
        run: |
          if [ ! -f "data/processed/train.csv" ] || [ ! -f "data/processed/test.csv" ]; then
            python src/prepare_data.py
          fi

      - name: Train, tune, evaluate, and log model
        run: python src/train_model.py

      - name: Commit best model to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib
          if git diff --staged --quiet; then
            echo "No changes to models/best_model.joblib to commit."
          else
            git commit -m "Complete Criteria 3: save tuned best model [skip ci]"
            git push
          fi
