name: Criteria 3 - Model Training & Tracking

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/train_model.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data preparation and verify splits
        run: |
          ls -la
          ls -la data/ || true
          python src/prepare_data.py
          ls -lh data/processed/

      - name: Train, tune, evaluate, and log model
        run: python src/train_model.py

      - name: Commit best model to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib
          if git diff --staged --quiet; then
            echo "No changes to models/best_model.joblib to commit."
          else
            git commit -m "Complete Criteria 3: save tuned best model [skip ci]"
            git push
          fi
