name: End-to-End MLOps Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/prepare_data.py"
      - "src/train_model.py"
      - "data/tourism.csv"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Data preparation and stratified split
        run: |
          python -u src/prepare_data.py
          ls -lh data/processed/

      - name: Step 2 - Model training, tuning, evaluation, and MLflow logging
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: python -u src/train_model.py

      - name: Step 3 - Verify trained model artifact
        run: |
          test -f models/best_model.joblib
          ls -lh models/best_model.joblib

      - name: Step 4 - Auto-commit and push updates to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib src/ app.py requirements.txt
          git status --short
          if git diff --staged --quiet; then
            echo "No changes to push to main."
          else
            git commit -m "Automated MLOps pipeline update [skip ci]"
            git push origin HEAD:main
          fi